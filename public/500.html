<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Архивариус. <!--# if expr="$status = 503" -->Техническое обслуживание<!--# else -->Ошибка сервера <!--# echo var="status" default="" --><!--# endif --></title>
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<!--# if expr="$status = 503" -->
<meta http-equiv="refresh" content="3">
<!--# endif -->
<style>
*,
*::before,
*::after {
	box-sizing: border-box;
}
html {
	font-family: sans-serif;
	line-height: 1.15;
	-webkit-text-size-adjust: 100%;
	-webkit-tap-highlight-color: rgba(0,0,0,0);
}
body {
	-ms-flex-align: center;
	align-items: center;
	background-color: #f5f5f5;
	display: -ms-flexbox;
	display: flex;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
	margin: 0;
}
body, html {
	height: 100%;
}
a {
	color: #fff;
}
h1 {	
	font-size: 180%;
}
.text {
	background: #602BFB;
	border-radius: .5em;
	color: #fff;
	margin: auto;
	max-width: 576px;
	padding: 1em 2em;
	text-align: center;
}
</style>
</head>
<body>
<div class="text">
<h1><!--# if expr="$status = 503" -->Сейчас проводится техническое обслуживание<!--# else -->Ошибка сервера <!--# echo var="status" default="" --><!--# endif --></h1>
<p><a href="/">Архивариус</a></p>
</div>
</body>
</html>
