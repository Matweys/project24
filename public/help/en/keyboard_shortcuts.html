<h1 class="fs-5" style="margin:0 0 1rem;">Edit file attributes form</h1>

<table class="table">
  <tr>
    <td>Ctrl-Alt-Right arrow</td>
    <td>Go to edit attributes of the next file</td>
  </tr>
  <tr>
    <td>Ctrl-Alt-Left arrow</td>

  </tr>
