<h1 class="fs-5" style="margin:0 0 1rem;">Окно редактирования атрибутов файла</h1>

<table class="table">
  <tr>
    <td>Ctrl-Alt-Стрелка влево</td>
    <td>Перейти к редактированию атрибутов предыдущего файла</td>
  </tr>
  <tr>
    <td>Ctrl-Alt-Стрелка влево</td>
    <td>Перейти к редактированию атрибутов следующего файла</td>
  </tr>
  <tr>
    <td>Ctrl-Shift-S</td>
    <td>Сохранить атрибуты и перейти к редактирования атрибутов следующего файлы</td>
  </tr>
</table>
